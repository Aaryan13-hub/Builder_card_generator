<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hacker House Goa 2026 — Builder Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Imbue:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,700&family=Victor+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js" defer></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js" defer></script>
</head>

<body>
  <main class="wrap">
    <!-- STEP 1: form -->
    <section id="formSection" class="card">
      <div class="field">
        <label for="photoInput"><i data-lucide="camera"></i> Your photo</label>
        <input type="file" id="photoInput" accept="image/*,.heic,.heif" />
        <p class="hint" id="photoHint">
          JPG, PNG, or iPhone HEIC. We'll auto-crop around your face.
        </p>
      </div>

        <p class="hint" id="detectionStatus">Detecting face…</p>
      <!-- Profile Frame preview (client-side canvas compositing) -->
      <div id="framePreviewWrap" class="frame-preview-wrap">
        <canvas id="frameCanvas" width="1080" height="1350"></canvas>
        <div id="frameControls" class="frame-controls" hidden>
          <div class="frame-zoom-row">
            <label for="frameZoomSlider"><i data-lucide="zoom-in"></i> Zoom</label>
            <input type="range" id="frameZoomSlider" min="1" max="3" step="0.05" value="1" />
          </div>
          <button id="frameResetBtn" class="btn link" type="button"><i data-lucide="rotate-ccw"></i> Reset position</button>
        </div>
      </div>

      <div class="field">
        <label for="nameInput"><i data-lucide="user"></i> Name</label>
        <input type="text" id="nameInput" placeholder="Your name" maxlength="60" />
      </div>

      <div class="field">
        <label for="roleInput"><i data-lucide="terminal"></i> Role / stack</label>
        <input type="text" id="roleInput" placeholder="e.g. Frontend Developer" maxlength="60" />
      </div>

      <!-- Profile Frame actions (visible when photo uploaded in frame mode) -->
      <div id="frameActions" class="frame-actions-wrap" hidden>
        <div class="actions">
          <a id="frameDownloadBtn" class="btn secondary"><i data-lucide="download"></i> Download PNG</a>
          <button id="frameShareBtn" class="btn primary" type="button"><i data-lucide="share-2"></i> Share to X</button>
        </div>
        <button id="frameStartOverBtn" class="btn link" type="button"><i data-lucide="rotate-ccw"></i> Start over</button>
      </div>
      <p class="error" id="formError" hidden></p>
    </section>

    <!-- loading overlay -->
    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="spinner"></div>
      <p id="loadingText">Generating your card…</p>
    </div>
  </main>

  <!-- face-api.js (browser IIFE build, bundles TF.js, exposes global `faceapi`) -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <!-- heic-to (actively maintained HEIC/HEIF -> JPEG converter, exposes global `HeicTo`) -->
  <script src="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js"></script>
  <script src="app.js"></script>

  <!-- decorative flourishes: icons, confetti burst, and a tilting badge on reveal -->
  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();

      const resultSection = document.getElementById("resultSection");
      const badge = document.querySelector(".badge-tilt");
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      if (badge && window.VanillaTilt) {
        VanillaTilt.init(badge, {
          max: 12,
          speed: 400,
          glare: true,
          "max-glare": 0.25,
          scale: 1.02,
        });
      }

      if (resultSection) {
        const observer = new MutationObserver(() => {
          if (!resultSection.hasAttribute("hidden")) {
            if (window.confetti && !prefersReducedMotion) {
              confetti({
                particleCount: 90,
                spread: 75,
                startVelocity: 45,
                origin: { y: 0.6 },
                colors: ["#fee101", "#ff0080", "#ffffff"],
              });
            }
          }
        });
        observer.observe(resultSection, {
          attributes: true,
          attributeFilter: ["hidden"],
        });
      }
    });
  </script>
</body>

</html>
